# Planted into public BluePrint / Charter DEST by scripts/export_*.sh.
# Do not edit on the public parcel — fix the private SoT copy
# (export/public/export-surface.yml) and re-export.
name: Export surface

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require export marker
        run: |
          set -euo pipefail
          if [ ! -f .blueprint-export ] && [ ! -f .charter-export ]; then
            echo "missing export marker (.blueprint-export or .charter-export)" >&2
            exit 1
          fi
          test -f .sync-head
          test -f scripts/check_export_scrub.py
          echo "ok  export marker + sync-head + planted scrub"

      - name: Scrub public surface
        run: python3 scripts/check_export_scrub.py --dest .
