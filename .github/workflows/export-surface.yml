# Canonical source validation. No private repository or generated export hop.
name: Source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify template mirror
        run: bash scripts/templates_sync.sh --check
      - name: Install wheel test build tools
        run: python -m pip install setuptools wheel
      - name: Validate source privacy
        run: python scripts/check_source_surface.py
      - name: Install candidate and WorkLane integration dependency
        # Reviewed local-roster authority support; do not test against an older
        # published engine that cannot enforce selected-workspace assignment.
        run: python -m pip install . 'git+https://github.com/protocolcity/WorkLane.git@767fad15552b86c0565d2991ef4dff7a92967fd3'
      - name: Verify operations and engine boundaries
        run: |
          BP_TEST_WORKLANE_PYTHON="$(command -v python)" PYTHONPATH=overview/v1 python -m unittest discover -s overview/v1/tests
          PYTHONPATH=map/v1 python -m unittest discover -s map/v1/tests
