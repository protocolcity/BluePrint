# Canonical source validation. No private repository or generated export hop.
name: Source validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify template mirror
        run: bash scripts/templates_sync.sh --check
      - name: Install wheel test build tools
        run: python -m pip install setuptools wheel build
      - name: Validate source privacy
        run: python scripts/check_source_surface.py
      - name: Install candidate and WorkLane integration dependency
        # Reviewed local-roster authority support; do not test against an older
        # published engine that cannot enforce selected-workspace assignment.
        run: python -m pip install . 'git+https://github.com/protocolcity/WorkLane.git@425067734c5283e70a444bc4b955b83aaf1eee3d'
      - name: Verify operations and engine boundaries
        run: |
          BP_TEST_WORKLANE_PYTHON="$(command -v python)" PYTHONPATH=overview/v1 python -m unittest discover -s overview/v1/tests
          PYTHONPATH=map/v1 python -m unittest discover -s map/v1/tests
      - name: Audit explicit unittest skips
        run: python scripts/audit_test_skips.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install desk and browser test tooling
        run: |
          python -m pip install setuptools wheel
          python -m pip install -r browser-tests/requirements-dev.lock
          python -m pip install "git+https://github.com/protocolcity/WorkLane.git@425067734c5283e70a444bc4b955b83aaf1eee3d"
          python -m playwright install --with-deps chromium
      - name: Playwright journeys (synthetic fixtures)
        run: BP_TEST_WORKLANE_PYTHON="$(command -v python)" python -m pytest browser-tests -q --browser chromium
      - name: Retain synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: browser-tests/artifacts/
          retention-days: 7

  public-cut:
    # Scan built sdists/wheels on every candidate so packaged files cannot carry host
    # MCP, /Users fingerprints, or .protocolcity runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and scan tools
        run: python -m pip install setuptools wheel build
      - name: Host-path scrub (source)
        run: python scripts/check_no_host_paths.py
      - name: Source privacy
        run: python scripts/check_source_surface.py
      - name: Cut metadata, notes, and artifact dry-run
        run: python scripts/check_release_artifacts.py
