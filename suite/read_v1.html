<!doctype html>
<html lang="en" class="suite-read-view suite-has-spine">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/brand/favicon.svg?v=pc-1285" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch.png?v=pc-1285">
<title>BluePrint — Paper</title>
<link rel="stylesheet" href="/suite.css?v=20260821-pc1298">
<script src="/esc.js?v=20260901-pc1396"></script>
<script src="/suite-nav.js?v=20260819-pc1290"></script>
<script src="/map/wo-buckets.js?v=20260804-pc1090"></script>
<script src="/suite-paper.js?v=20260804-pc1084"></script>
<style>
  .pathbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px;
    margin: 18px 0 8px; font-size: var(--type-body); letter-spacing: 0.06em;
    opacity: 0.9;
  }
  .pathbar a { color: var(--line); text-decoration: none; border-bottom: 1px solid var(--line-faint); }
  .pathbar a:hover { border-bottom-color: var(--line); }
  .pathbar .sep { opacity: 0.45; margin: 0 2px; }
  .pathbar .here { opacity: 1; font-weight: var(--weight-medium); border-bottom: none; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 18px; font-size: var(--type-label); letter-spacing: 0.1em;
    text-transform: uppercase; opacity: 0.7;
  }
  .badge {
    border: 1px solid var(--gold); color: var(--gold);
    padding: 1px 8px; letter-spacing: 0.12em; font-size: var(--type-label);
  }
  .paper {
    border: 1.5px solid var(--line); background: var(--paper-deep);
    padding: 28px 32px 40px; max-width: 820px; position: relative;
  }
  .paper .corner { position: absolute; width: 7px; height: 7px; border: 1.5px solid var(--line); }
  .corner.tl { top: -4px; left: -4px; border-right: none; border-bottom: none; }
  .corner.br { bottom: -4px; right: -4px; border-left: none; border-top: none; }
  .md { font-size: var(--type-body); line-height: 1.65; color: var(--line); word-wrap: break-word; }
  .md h1, .md h2, .md h3, .md h4 {
    font-weight: var(--weight-medium); letter-spacing: 0.04em; margin: 1.25em 0 0.5em;
    line-height: 1.3;
  }
  .md h1 { font-size: var(--type-display); border-bottom: 1px solid var(--line-faint); padding-bottom: 0.35em; }
  .md h2 { font-size: var(--type-heading); }
  .md h3 { font-size: var(--type-body); opacity: 0.95; }
  .md p { margin: 0.7em 0; }
  .md ul, .md ol { margin: 0.6em 0; padding-left: 1.4em; }
  .md li { margin: 0.25em 0; }
  .md code {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: var(--type-caption);
    background: rgba(0,0,0,0.22); padding: 0.1em 0.35em; border-radius: 2px;
  }
  .md pre {
    background: rgba(0,0,0,0.28); border: 1px solid var(--line-faint);
    padding: 12px 14px; overflow-x: auto; margin: 0.9em 0; font-size: var(--type-body);
    line-height: 1.45;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote {
    border-left: 3px solid var(--line-faint); margin: 0.8em 0; padding: 0.2em 0 0.2em 1em;
    opacity: 0.9;
  }
  .md table { border-collapse: collapse; width: 100%; margin: 0.9em 0; font-size: var(--type-body); }
  .md th, .md td { border: 1px solid var(--line-faint); padding: 6px 10px; text-align: left; }
  .md th { background: rgba(0,0,0,0.18); }
  .md a { color: var(--gold); }
  .md hr { border: none; border-top: 1px solid var(--line-faint); margin: 1.4em 0; }
  .raw-toggle { font-size: var(--type-label); letter-spacing: 0.1em; text-transform: uppercase;
                opacity: 0.65; cursor: pointer; border: none; background: none; color: var(--line); }
  .raw-toggle:hover { opacity: 1; }
  #raw { display: none; white-space: pre-wrap; font-family: "SF Mono", Menlo, monospace;
         font-size: var(--type-body); line-height: 1.5; }
  #raw.show { display: block; }
  #view.hide { display: none; }
</style>
</head>
<body>
<aside class="suite-spine" id="suite-spine" aria-label="BluePrint">
  <div class="suite-spine-brand">
    <a class="suite-spine-lockup" href="/" aria-label="BluePrint">
      <img class="suite-spine-mark" src="/brand/mark-cyanotype.svg?v=pc-1288" width="64" height="52" alt="">
      <span class="suite-spine-word">BluePrint</span>
    </a>
  </div>
  <nav aria-label="Lenses">
    <a href="/overview" data-spine-lens="overview">Overview</a>
    <a href="/workspace-map" data-spine-lens="map">Map</a>
    <a href="/calendar" data-spine-lens="calendar">Calendar</a>
    <a href="/settings" data-spine-lens="settings">Settings</a>
  </nav>
  <p class="suite-spine-hint"><a href="https://github.com/protocolcity/BluePrint" target="_blank" rel="noopener"><span class="suite-powered-bolt" aria-hidden="true">⚡</span><span class="suite-powered-label">Powered by</span><span class="suite-powered-name">ProtocolCity</span></a></p>
</aside>
<header class="suite-head">
  <div class="suite-mast">
    <div class="suite-title">
      <h1 id="title">Paper</h1>
      <div class="sub" id="sub">Read in place</div>
    </div>
  </div>
</header>

<div id="suite-body">
<div class="pathbar" id="pathbar"></div>
<div class="meta" id="meta" hidden></div>

<div class="paper" id="sheet" hidden>
  <span class="corner tl"></span><span class="corner br"></span>
  <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
    <button type="button" class="raw-toggle" id="toggle-raw">view source</button>
  </div>
  <div class="md" id="view"></div>
  <pre id="raw"></pre>
</div>
<div class="err" id="err" hidden></div>

<script>
const Q = new URLSearchParams(location.search);
const PATH = (Q.get("path") || "").replace(/^\/+/, "");
const BACK = Q.get("back") || "";

const esc = function (s) { return window.__bp.esc(s); };

/* Markdown render lives in suite-paper.js (shared with the side drawer). */
function renderMd(src, path) {
  if (window.SuitePaper && SuitePaper.renderMd) return SuitePaper.renderMd(src, path);
  return "<pre>" + esc(src) + "</pre>";
}

function mapHrefForDir(dirParts) {
  /* dirParts relative to city root, e.g. ["tradeOS","ops"] or [] */
  if (!dirParts.length) return "/";
  const project = dirParts[0];
  const rest = dirParts.slice(1);
  if (window.SuiteNav && SuiteNav.placeHref) {
    return SuiteNav.placeHref(project, rest.join("/"));
  }
  let href = "/workspace-map?project=" + encodeURIComponent(project);
  if (rest.length) href += "&path=" + encodeURIComponent(rest.join("/"));
  return href;
}

function buildPathbar(relPath) {
  const bar = document.getElementById("pathbar");
  const parts = relPath.split("/").filter(Boolean);
  const file = parts.pop() || relPath;
  const bits = [];
  bits.push('<a href="/">Overview</a>');
  let acc = [];
  parts.forEach((p) => {
    acc.push(p);
    bits.push('<span class="sep">/</span>');
    bits.push('<a href="' + mapHrefForDir(acc.slice()) + '">' + esc(p) + "</a>");
  });
  bits.push('<span class="sep">/</span>');
  bits.push('<span class="here">' + esc(file) + "</span>");
  bar.innerHTML = bits.join("");
}

async function main() {
  if (!PATH) {
    document.getElementById("err").hidden = false;
    document.getElementById("err").textContent =
      "No paper path — open a .md from Map or project Home.";
    return;
  }
  /* Cold load / hard-nav: same short path as soft-nav when SuitePaper is live */
  if (window.SuitePaper && typeof SuitePaper.mountFullPagePaper === "function") {
    if (window.SuitePaper.install) SuitePaper.install();
    var ok = await SuitePaper.mountFullPagePaper(PATH, { push: false });
    if (ok !== false) return;
    /* fall through to legacy paint if mount failed without painting */
  }
  buildPathbar(PATH);

  const back = BACK || mapHrefForDir(PATH.split("/").slice(0, -1));
  /* Peer doors: project from path (tradeOS/…) or back URL — never drop to city only */
  let project = "";
  if (window.SuiteNav) {
    project =
      SuiteNav.projectFromCityPath(PATH) ||
      SuiteNav.projectFromSearch() ||
      "";
    if (!project && BACK) {
      try {
        const u = new URL(BACK, location.origin);
        project = u.searchParams.get("project") || "";
      } catch (e) {}
    }
    SuiteNav.apply({ room: "read", project: project });
  }
  /* pc-495: dig-in default stays SuitePaper after full-page paper */
  if (window.SuitePaper && SuitePaper.install) SuitePaper.install();

  let data;
  try {
    const r = await fetch("/api/file?path=" + encodeURIComponent(PATH));
    data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
  } catch (e) {
    document.getElementById("err").hidden = false;
    document.getElementById("err").textContent = "Could not open paper: " + e.message;
    return;
  }

  document.getElementById("title").textContent = data.name;
  document.title =
    window.SuiteNav && typeof SuiteNav.docTitle === "function"
      ? SuiteNav.docTitle(data.name)
      : "BluePrint — " + data.name;
  document.getElementById("sub").textContent = PATH + " · read-only in BluePrint";

  const meta = document.getElementById("meta");
  meta.hidden = false;
  meta.innerHTML =
    (data.rule ? '<span class="badge">law / required</span>' : '<span>document</span>') +
    "<span>" + (data.bytes || 0) + " bytes</span>" +
    '<a href="' +
    (BACK || back) +
    '">← back to ' +
    (project ? "Home" : "Files") +
    "</a>";

  document.getElementById("sheet").hidden = false;
  const viewEl = document.getElementById("view");
  viewEl.innerHTML = renderMd(data.content || "", PATH);
  if (window.SuitePaper && SuitePaper.wireRelativeLinks) {
    SuitePaper.wireRelativeLinks(viewEl);
  }
  document.getElementById("raw").textContent = data.content || "";

  document.getElementById("toggle-raw").onclick = () => {
    const raw = document.getElementById("raw");
    const view = document.getElementById("view");
    const on = !raw.classList.contains("show");
    raw.classList.toggle("show", on);
    view.classList.toggle("hide", on);
    document.getElementById("toggle-raw").textContent = on ? "view rendered" : "view source";
  };
}
main();
</script>
</div>
</body>
</html>
