<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BluePrint — Map V1</title>
  <link rel="stylesheet" href="./css/workspace_map.css" />
</head>
<body>
  <main id="map-shell" class="map-shell" aria-label="Workspace map">
    <div id="map-stage" class="map-stage">
      <svg id="map-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" aria-hidden="false">
        <g id="world">
          <!-- Paint stack layers are created by ensureLayers() at boot:
               #lots · #hub · #dig-in-layer · #md-viewer-layer · #chrome-layer -->
        </g>
      </svg>

      <div id="md-viewer-host" class="map-md-host" data-hit-layer="md-viewer"></div>

      <div id="map-chrome" class="map-chrome" data-hit-layer="chrome">
        <div id="map-sidebar" class="map-sidebar">
          <details class="map-chrome-hit map-chrome-panel map-browser" open>
            <summary>Projects and papers</summary>
            <section id="map-project-context" aria-label="Work context">Reading work context…</section>
            <p id="map-browser-path" aria-live="polite">Workspace</p>
            <div id="map-browser-list" aria-label="Folders and documents"></div>
          </details>
          <section id="map-project-panel" class="map-chrome-hit map-chrome-panel map-project-panel" hidden aria-label="Project focus">
            <button type="button" id="map-project-back" class="map-project-back">&larr; Workspace</button>
            <h2 id="map-project-name"></h2>
            <div id="map-branch-buttons" role="group" aria-label="Project sections"></div>
            <div id="map-branch-items" aria-live="polite"></div>
            <div id="map-item-detail" hidden aria-live="polite"></div>
          </section>
        </div>
        <details id="map-view-options" class="map-chrome-hit map-chrome-panel">
          <summary>View</summary>
          <label><input type="checkbox" id="flt-managed" checked /> Projects</label>
          <label><input type="checkbox" id="flt-unmanaged" /> Other workspace folders</label>
          <label><input type="checkbox" id="flt-hidden" /> Hidden</label>
        </details>
        <button id="map-reset" type="button" class="map-chrome-hit map-chrome-btn">Workspace</button>
        <div id="map-page-controls" class="map-chrome-hit map-chrome-panel" hidden><button type="button" id="map-page-prev">Previous</button><span id="map-page-status" aria-live="polite"></span><button type="button" id="map-page-next">Next</button></div>
        <nav id="map-dig-trail" class="map-chrome-hit map-trail" hidden></nav>
      </div>
    </div>
  </main>

  <script type="module" src="./js/workspace_map_app.v1.js"></script>
</body>
</html>
