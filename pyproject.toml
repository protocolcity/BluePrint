[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Preferred PyPI name. Forever-compat alias is packaging/pypi/protocolcity.
# Bare PyPI name `blueprint` is taken by unrelated software.
name = "protocolcity-blueprint"
version = "0.1.51"
description = "BluePrint suite — Overview and Map over WorkLane + WorkForce"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Public cut 0.1.50 — engines already on PyPI. Pin exact; do not float.
engines = ["protocolcity-worklane==0.1.9", "protocolcity-workforce==0.1.9"]

[project.scripts]
blueprint = "protocolcity.operations_cli:main"
blueprint-overview = "protocolcity.desk_entry:overview"
blueprint-map = "protocolcity.desk_entry:map_view"

[tool.setuptools.packages.find]
where = ["."]
include = ["protocolcity*", "suite*", "overview.v1*", "map.v1*"]
exclude = ["*.tests", "*.tests.*", "overview.v1.tests*", "map.v1.tests*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.md", "*.svg", "*.png", "*.ico", "*.woff2", "templates/**/*", "static/**/*", "components/**/*", "brand/**/*"]

# Host MCP / env files must never ride along even though *.json is shipped.
[tool.setuptools.exclude-package-data]
"*" = [".mcp.json", ".env", ".env.*"]
