[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolcity-blueprint"
version = "0.1.47+consolidation.15"
description = "BluePrint isolated runtime consolidation candidate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
engines = ["protocolcity-worklane==0.1.7", "protocolcity-workforce==0.1.7"]

[project.scripts]
blueprint = "protocolcity.operations_cli:main"
blueprint-overview = "protocolcity.desk_entry:overview"
blueprint-map = "protocolcity.desk_entry:map_view"

[tool.setuptools.packages.find]
where = ["."]
include = ["protocolcity*", "suite*", "overview.v1*", "map.v1*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json", "*.md", "*.svg", "*.png", "*.ico", "*.woff2", "templates/**/*", "static/**/*", "components/**/*", "brand/**/*"]
